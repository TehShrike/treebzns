# CircleCI configuration
# See: https://circleci.com/docs/reference/configuration-reference
version: 2.1

executors:
  node:
    docker:
      # Node version is pinned to match the `engines` field in package.json (>=25).
      - image: cimg/node:25.9

commands:
  setup_pnpm:
    description: Enable pnpm via corepack, restore caches, and install dependencies.
    steps:
      - restore_cache:
          keys:
            # corepack + pnpm binaries (~/.npm-global, ~/.cache/node/corepack) and the pnpm store.
            - pnpm-v2-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-v2-
      - run:
          name: Enable pnpm via corepack
          # Node 25 no longer bundles corepack, so install it into a cached, PATH-added prefix.
          # corepack then reads the pinned pnpm version from the `packageManager` field in package.json.
          command: |
            npm config set prefix "$HOME/.npm-global"
            echo 'export PATH="$HOME/.npm-global/bin:$PATH"' >> "$BASH_ENV"
            export PATH="$HOME/.npm-global/bin:$PATH"
            command -v corepack >/dev/null || npm install -g corepack@latest
            corepack enable --install-directory "$HOME/.npm-global/bin"
            corepack prepare --activate
            pnpm config set store-dir "$HOME/.pnpm-store"
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-v2-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store
            - ~/.npm-global
            - ~/.cache/node/corepack

jobs:
  test:
    executor: node
    steps:
      - checkout
      - setup_pnpm
      - run:
          name: Generate globbed modules
          # *.generated.* files are gitignored; tsc/svelte-check import them.
          command: pnpm run build:glob
      - run:
          name: Run tests
          command: pnpm run test

  migrate:
    executor: node
    steps:
      - checkout
      - setup_pnpm
      - run:
          name: Run database migrations
          # DB credentials are provided via project environment variables in the CircleCI web UI.
          command: pnpm run prod:db_migrate

workflows:
  test_and_migrate:
    jobs:
      # Runs on every branch.
      - test
      # Migrations run only on master, after tests pass.
      - migrate:
          requires:
            - test
          filters:
            branches:
              only: master
