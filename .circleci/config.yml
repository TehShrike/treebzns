# CircleCI configuration
# See: https://circleci.com/docs/reference/configuration-reference
version: 2.1

executors:
  node:
    docker:
      # Node version is pinned to match the `engines` field in package.json (>=25).
      - image: cimg/node:25.9

commands:
  setup_pnpm:
    description: Enable pnpm via corepack, restore caches, and install dependencies.
    steps:
      - run:
          name: Enable pnpm via corepack
          # corepack reads the pinned pnpm version from the `packageManager` field in package.json.
          command: |
            corepack enable
            corepack prepare --activate
            pnpm config set store-dir ~/.pnpm-store
      - restore_cache:
          keys:
            # pnpm store + the pnpm binary downloaded by corepack.
            - pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-v1-
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store
            - ~/.cache/node/corepack

jobs:
  test:
    executor: node
    steps:
      - checkout
      - setup_pnpm
      - run:
          name: Generate globbed modules
          # *.generated.* files are gitignored; tsc/svelte-check import them.
          command: pnpm run build:glob
      - run:
          name: Run tests
          command: pnpm run test

  migrate:
    executor: node
    steps:
      - checkout
      - setup_pnpm
      - run:
          name: Run database migrations
          # DB credentials are provided via project environment variables in the CircleCI web UI.
          command: pnpm run prod:db_migrate

workflows:
  test_and_migrate:
    jobs:
      # Runs on every branch.
      - test
      # Migrations run only on master, after tests pass.
      - migrate:
          requires:
            - test
          filters:
            branches:
              only: master
